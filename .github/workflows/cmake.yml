name: CMake

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    runs-on: ubuntu-latest

    strategy:
      # Let the other build type finish when one of them fails.
      fail-fast: false
      matrix:
        # One job per build type. A single-configuration generator takes exactly one CMAKE_BUILD_TYPE.
        build_type: [ Debug, Release ]

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies on ubuntu
      run: |
        sudo apt update
        sudo apt install build-essential ninja-build cmake libopenmpi-dev libboost-all-dev libeigen3-dev libblas-dev liblapack-dev
        cmake --version
        g++ --version
    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory and include the unit tests.
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{matrix.build_type}} -DLMC_BUILD_TESTS=ON

    - name: Build
      # Build the program and the tests with the given configuration
      run: cmake --build ${{github.workspace}}/build -j 4

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest --output-on-failure
